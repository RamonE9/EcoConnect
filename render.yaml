services:
  - type: web
    name: ecoconnect
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecoconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: ecoconnect-db
    plan: free
    databaseName: ecoconnect
    user: ecoconnect
